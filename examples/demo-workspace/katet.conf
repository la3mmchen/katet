# katet workspace settings: `key value`, one per line; a line's trailing `  # …` is a comment.
port 8766                         # the board's port on 127.0.0.1 (8765 is likely your real workspace)
editor zed                        # zed | vscode | cursor | none — the board's "open repo" button
ticket-url https://acme.atlassian.net/browse/{key}
repo-hint ~/repos/acme/<repo>     # placeholder shown when adding repos to a task
